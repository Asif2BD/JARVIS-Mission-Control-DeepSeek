name: Cut plugin release

# One-click release for dsh-plugin-mission-control: verifies tests, tags
# plugin-v<version>, and creates the GitHub release. Publishing to npm then
# happens automatically via npm-publish.yml (triggered by the release event,
# requires the NPM_TOKEN secret).
#
# Trigger from the Actions tab (or API). The version is read from the
# plugin's package.json — bump it there first.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify and show what would be released, without tagging'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read plugin version
        id: ver
        working-directory: integrations/deepseek-harness/dsh-plugin-mission-control
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=plugin-v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Refuse to re-release an existing tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" | grep -q .; then
            echo "::error::Tag ${{ steps.ver.outputs.tag }} already exists — bump the plugin version first."
            exit 1
          fi
      - name: Run plugin tests
        working-directory: integrations/deepseek-harness/dsh-plugin-mission-control
        run: npm test
      - name: Verify npm pack contents
        working-directory: integrations/deepseek-harness/dsh-plugin-mission-control
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q "README.md" pack.txt || { echo "::error::README missing from tarball"; exit 1; }
          grep -q "cordis.patch.yml" pack.txt || { echo "::error::bundle patch missing from tarball"; exit 1; }
      - name: Create tag + GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "dsh-plugin-mission-control ${{ steps.ver.outputs.version }}" \
            --generate-notes \
            --notes "Publishes \`dsh-plugin-mission-control@${{ steps.ver.outputs.version }}\` to npm (via the npm-publish workflow). Validated against \`@deepseek-ai/dsh@0.1.0-rc.7\`."
          echo "Release created — npm-publish.yml takes it from here (requires NPM_TOKEN secret)."
      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: echo "Dry run only — would have created tag ${{ steps.ver.outputs.tag }} and its GitHub release."
